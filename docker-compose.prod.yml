services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athar}
      POSTGRES_DB: ${POSTGRES_DB:-athar}
    ports:
      - "5432:5432"
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-open-banking:
    build:
      context: .
      dockerfile: Dockerfile.mock-open-banking
    environment:
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - "8100:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/openapi.json', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      OPEN_BANKING_PROVIDER: mock
      MOCK_OB_BASE_URL: http://mock-open-banking:8100
      DATABASE_URL: postgresql://${POSTGRES_USER:-athar}:${POSTGRES_PASSWORD:-athar}@db:5432/${POSTGRES_DB:-athar}
      JOURNEY_STORE_MAX: ${JOURNEY_STORE_MAX:-500}
      APPLICATION_STORE_MAX: ${APPLICATION_STORE_MAX:-500}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mock-open-banking:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prod_pgdata:
